*{box-sizing:border-box}

h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--mu);font-size:13px}
main{padding:8px 14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:2px 8px;background:var(--ac);color:#fff;margin-bottom:6px}
.tag.g{background:var(--ac2)}.tag.n{background:#777}
label.it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bd)}
label.it:first-of-type{border-top:0}
label.it input{width:22px;height:22px;margin-top:1px;accent-color:var(--ac);flex:0 0 auto}
label.it input:checked+span{text-decoration:line-through;color:var(--mu)}
.meal{padding:8px 0;border-top:1px solid var(--bd)}
.meal:first-of-type{border-top:0}
.meal b{display:block;font-size:14px}
.meal span{color:var(--mu);font-size:14px}
.meal em{font-style:normal;color:var(--tx);font-size:15px;display:block;margin-top:2px}
.sub{color:var(--mu);font-size:13px;margin:0 0 4px}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--ac2);width:0;transition:width .2s}
.kc{float:right;color:var(--ac2);font-weight:600;font-size:14px;margin-left:8px}
.ex{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input.n{width:68px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:6px;font-size:15px}
.gy{display:flex;gap:6px;align-items:center;margin:0 0 8px 32px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
button.r{border:0;background:none;color:var(--ac);font-size:13px;padding:6px 0}
.wu{display:flex;gap:8px;align-items:center;margin:0 0 6px 32px;font-size:13px;color:var(--mu)}
.wu input{width:20px;height:20px;accent-color:var(--ac2);flex:0 0 auto}
.wu input:checked+span{text-decoration:line-through}
.th{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cl{aspect-ratio:1;border-radius:8px;font-size:11px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);color:var(--mu)}
.cl.ok{background:#2f9e5b;color:#fff;border-color:#2f9e5b}.cl.pa{background:#e0a31a;color:#fff;border-color:#e0a31a}.cl.no{background:var(--bd)}.cl.hoy{outline:2px solid var(--ac)}
.lock{opacity:.4;pointer-events:none}
.big{width:100%;border:0;background:var(--ac);color:#fff;border-radius:12px;padding:12px;font-size:16px}
select.sel{flex:1;min-width:0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:8px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;padding:6px 0}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--ac);font-weight:600}

function xk(n){return (parseInt(S.ex[n])||0)+(S.un[n]||[]).reduce(function(a,u){return a+u.k},0)}
function pre(i){if(i==="")return;document.getElementById("un").value=PRE[i][0];document.getElementById("uk").value=PRE[i][1]}
function addUn(n){var k=parseInt(document.getElementById("uk").value),x=document.getElementById("un").value.trim()||"Comida no prevista";if(!k||k<1)return;(S.un[n]=S.un[n]||[]).push({n:x,k:k,s:document.getElementById("us").value});save();render()}
function delUn(n,i){S.un[n].splice(i,1);save();render()}
function recalc(n){var D=DIAS[n],rp=subs(n),eaten=xk(n),pend=[];
  D.s.forEach(function(s){if(s[0]==="x"||rp[s[0]])return;if(S.ck["m"+n+s[0]])eaten+=opt(n,s[0])[2];else pend.push(s[0])});
  var rem=D.tg-eaten;
  if(!pend.length){S.rcm[n]="No quedan comidas pendientes. Llevas "+eaten+" de "+D.tg+" kcal.";save();render();return}
  var C=pend.map(function(s){return OPT[s].filter(function(o){return o[3].length})}),best=null,cur=[];
  (function rec(i,sum,ch){if(i===C.length){var sc=Math.abs(sum-rem)+ch*25;if(!best||sc<best.sc)best={sc:sc,sum:sum,ids:cur.slice()};return}C[i].forEach(function(o){cur[i]=o[0];rec(i+1,sum+o[2],ch+(o[0]===opt(n,pend[i])[0]?0:1))})})(0,0,0);
  pend.forEach(function(s,i){S.pl[n+s]=best.ids[i]});
  var df=rem-best.sum;
  S.rcm[n]="Pendiente: "+rem+" kcal. Plan ajustado a "+best.sum+" kcal."+(df>150?" Te faltan ~"+df+" kcal: añade un yogur griego con plátano y frutos secos (~400).":df<-150?" Vas ~"+(-df)+" kcal por encima: cena ligera y no te saltes comidas para compensar.":" Perfecto.");
  save();render()}
function unView(n){var L=S.un[n]||[],h='<div class="card"><h3>🍔 ¿Comiste algo no previsto?</h3><p class="sub">Elige uno orientativo o escribe el tuyo. Para un cálculo más fino, mándame la foto o el texto en el chat del proyecto y te digo los kcal.</p>';
  h+=L.map(function(u,i){return '<div class="meal"><b>'+esc(u.n)+'</b><span class="kc">'+u.k+' kcal</span><em>'+(u.s?'Sustituye: '+SL[u.s].toLowerCase():'Extra')+'</em><button class="r" onclick="delUn(\''+n+'\','+i+')">Quitar</button></div>'}).join("");
  h+='<select class="sel" style="width:100%;margin:6px 0" onchange="pre(this.value)"><option value="">Orientativos…</option>'+PRE.map(function(p,i){return '<option value="'+i+'">'+p[0]+' · ~'+p[1]+'</option>'}).join("")+'</select>';
  h+='<div class="ex"><input class="n" style="flex:1;width:auto" id="un" placeholder="Qué comiste"><input class="n" id="uk" type="number" inputmode="numeric" placeholder="kcal"><select class="sel" id="us"><option value="">Es un extra</option>'+Object.keys(SL).map(function(k){return '<option value="'+k+'">Sustituye '+SL[k].toLowerCase()+'</option>'}).join("")+'</select><button class="chip on" onclick="addUn(\''+n+'\')">Añadir</button></div>';
  h+='<button class="big" style="margin-top:10px" onclick="recalc(\''+n+'\')">🔄 Recalcular el resto del día</button><p class="sub">Marca antes lo que ya comiste. Lo pendiente se ajusta a tus kcal.</p>'+(S.rcm[n]?'<p class="sub"><b>'+esc(S.rcm[n])+'</b></p>':'')+'</div>';return h}
var WARM={
"Mar":["5 min de bici o cinta suave (que suba la temperatura)","Movilidad de tobillo y cadera: sentadilla goblet profunda con pausa ×8","Puente de glúteo ×15 y zancada atrás sin peso ×8 por pierna"],
"Jue":["Rotación externa en polea ×15 por brazo (manguito rotador)","Goma elástica: brazos estirados de delante a atrás por encima de la cabeza ×10","Retracción escapular o face pull ligero ×12","Movilidad torácica: rotaciones en cuadrupedia ×8 por lado"],
"Vie":["Colgarte de la barra 2 × 20 s con escápulas activas","Retracción escapular en jalón o polea con peso mínimo ×12","Rotación externa con goma o polea ×15 por brazo","Movilidad torácica: gato-camello ×8"],
"Sáb":["Rotación externa en polea ×15 por brazo","Goma elástica: brazos estirados de delante a atrás ×10","Retracción escapular ×12"]};
function wup(id,e,b){var w=e[8];if(!w)return"";b=parseFloat(b)||0;return w.map(function(x,j){var kg=b?Math.round(b*x[0]/100/2.5)*2.5:0,wid=id+"w"+j;return `<label class="wu"><input type="checkbox" ${S.ck[wid]?'checked':''} onchange="tg('${wid}',this.checked)"><span>Aproximación ${j+1}: ${x[0]} % × ${x[1]}${kg?' → <b>'+kg+' kg</b>':''}</span></label>`}).join("")}
var REGLAS=["Día malo: haz solo los ★ (≈20–25 min). Cuenta como entreno hecho.","Doble progresión: cuando llegues al tope de reps en todas las series, sube peso. La app te lo dice con 🎯.","Series de aproximación: salen en cada básico con su peso calculado (ej. banca 50 % × 8 y 80 % × 3). Márcalas, no son opcionales.","RIR = reps que te quedan en el tanque. 1–2 en básicos, 0–1 en aislados: cerca del fallo es lo que hace crecer.","Descansos: 2–3 min en básicos, 60–90 s en aislados. Más descanso = más peso útil.","Semana de descarga: la del examen de ISO (16–22 nov). Mismos pesos, 2 series por ejercicio y RIR 3."];
var TIPS=[
["⚡ Dónde meter los carbos","Comida (14:30) y cena tras entrenar son los puntos fuertes. Días de boxeo: arroz o pasta generosos en la comida y plátano a las 18:00. Evita grasa y fibra pesada en las 2 h antes de entrenar."],
["Antes del gym (16:00)","Si llegas flojo: plátano 30–45 min antes. Cafeína opcional: un café doble ~45 min antes (150–200 mg) y nada de cafeína después de las 16:00 para dormir bien."],
["Después de entrenar","Come en la hora o dos siguientes: carbos + 30–40 g de proteína. No corras: lo que manda es el total del día."],
["Proteína","~2 g/kg (≈135 g/día) en 4–5 comidas de 30–40 g. Con 3.500 kcal casi seguro llegas. Si un día falla, tira de yogur griego, huevos o queso fresco."],
["Plan B por imprevistos","Si comes fuera o no hay lo que tocaba: elige carbo + proteína (pasta, arroz, bocata, hamburguesa), cambia el menú en Dieta y no te saltes comidas para compensar."],
["Sueño","Es donde se crece: 7–9 h. Móvil fuera de la cama y cena a hora fija. Una siesta corta (<30 min) no te roba el sueño de la noche."],
["Ritmo de peso","Objetivo: +0,25–0,5 kg/semana. Pésate en ayunas siempre el mismo día. Dos semanas sin subir: +200 kcal (más arroz en la comida)."],

["Creatina","3–5 g a diario, idealmente tras el gym o el boxeo con la merienda o la cena."],
["Ashwagandha","Por la noche con la cena: ayuda a bajar revoluciones tras el boxeo."],
["Hidratación","En boxeo puedes quemar 600–800 kcal por sesión: lleva siempre la botella llena."],
["Dercutane","Tómalo con la comida principal que lleve grasa (aceite, huevos, salmón, cacahuete) y cuida la hidratación."]];

var tab=S.tab||"hoy";
var dia=S.dia||ORD[(new Date().getDay()+6)%7];
var gd=S.gd||(GYM[dia]?dia:"Mar");
if(!GYM[gd])gd="Mar";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function chips(list,cur,fn){return '<div class="chips">'+list.map(function(d){return '<button class="chip'+(d===cur?' on':'')+'" onclick="'+fn+'(\''+d+'\')">'+d+'</button>'}).join("")+'</div>'}
function chk(id,txt){return '<label class="it"><input type="checkbox" '+(S.ck[id]?'checked':'')+' onchange="tg(\''+id+'\',this.checked)"><span>'+esc(txt)+'</span></label>'}
function tg(id,v){if(v)S.ck[id]=1;else delete S.ck[id];save();if(tab==="compra"||tab==="gym")prog()}
function prog(){
  var p=document.getElementById("pg");if(!p)return;
  var all=document.querySelectorAll("label.it input"),n=0;
  all.forEach(function(c){if(c.checked)n++});
  p.style.width=(all.length?n/all.length*100:0)+"%";
  var t=document.getElementById("pt");if(t)t.textContent=n+" / "+all.length;
}
function tm(d,i,v){tg("m"+d+i,v);render()}
function setEx(v){S.ex[dia]=v;save();render()}
function last(k){var t=new Date().toISOString().slice(0,10);return k.d===t?[k.pv,k.pr]:[k.v,k.r]}
function goal(l,e){var p=parseFloat(l[0]),r=parseInt(l[1]);if(!p||!r)return"";return r>=e[3]?"🎯 Hoy: "+(p+e[7])+" kg":"🎯 Hoy: "+p+" kg × "+(r+1)}
function sk(id,f,v){var k=S.kg[id]||{},t=new Date().toISOString().slice(0,10);if(k.d!==t){k.pv=k.v;k.pr=k.r;k.v="";k.r="";k.d=t}k[f]=v;S.kg[id]=k;save();render()}
function setTab(t){tab=t;S.tab=t;save();render();window.scrollTo(0,0)}
function setDia(d){dia=d;S.dia=d;save();render()}
function setGd(d){gd=d;S.gd=d;save();render()}
function reset(pref){Object.keys(S.ck).forEach(function(k){if(k.indexOf(pref)===0)delete S.ck[k]});save();render()}

function render(){
  var h="";
  document.querySelectorAll("nav button").forEach(function(b){b.className=b.dataset.t===tab?"on":""});
  if(tab==="hoy"){h+=hoyView();}else if(tab==="prog"){h+=progView();}else if(tab==="compra"){
    var L=lista(),cs=[["c","🥩 Carne, pescado y huevos"],["f","🥖 Fruta y patatas"],["l","🥛 Lácteos"],["d","🍚 Despensa"]];
    h+=`<div class="card"><b>Progreso</b> <span id="pt" style="float:right;color:var(--mu)"></span><div class="bar"><i id="pg"></i></div><p class="sub">Se genera sola con los menús que elijas en Dieta (semana completa). Cambia un menú y la lista se ajusta.</p><label class="sub" style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${S.sc?'':'checked'} onchange="S.sc=this.checked?0:1;save();render()"> Incluir las comidas que cocina la señora</label><button class="r" onclick="reset('c')">Desmarcar todo</button></div>`;
    cs.forEach(function(c){var ks=Object.keys(L).filter(function(k){return ITEMS[k][2]===c[0]});
      if(ks.length)h+='<div class="card"><h3>'+c[1]+'</h3>'+ks.map(function(k){return chk("c"+k,ITEMS[k][0]+" — "+fmt(k,L[k]))}).join("")+'</div>'});
    h+='<p class="sub" style="padding:0 4px">Revisa despensa: sal, pimienta, ajo en polvo.</p>';
  }else if(tab==="dieta"){
    var d=DIAS[dia],tot=0,eat=0,rp=subs(dia);
    d.s.forEach(function(s){if(s[0]==="x"||rp[s[0]])return;var o=opt(dia,s[0]);tot+=o[2];if(S.ck["m"+dia+s[0]])eat+=o[2]});
    var ex=parseInt(S.ex[dia])||0,cons=eat+xk(dia),pc=Math.min(100,Math.round(cons/d.tg*100));
    h+=chips(ORD,dia,"setDia");
    h+='<div class="card"><span class="tag '+d.k+'">'+esc(d.t)+'</span>'+(d.sub?'<p class="sub">'+esc(d.sub)+'</p>':'');
    h+='<b>Consumidas: '+cons+' / '+d.tg+' kcal</b><div class="bar"><i style="width:'+pc+'%"></i></div>';
    h+='<p class="sub">Plan del día: ~'+tot+' kcal (estimaciones aproximadas)</p>';
    h+='<div class="ex">Extra no listado: <input class="n" type="number" inputmode="numeric" value="'+(ex||"")+'" placeholder="0" onchange="setEx(this.value)"> kcal</div></div>';
    h+='<div class="card">'+d.s.map(function(s){
      if(s[0]==="x")return '<div class="meal"><b>'+esc(s[1]+' · '+s[2])+'</b></div>';
      var rpl=rp[s[0]];if(rpl)return '<div class="meal"><b>'+s[1]+' '+SL[s[0]]+'</b><em>🔁 Sustituida: '+esc(rpl)+'</em></div>';var o=opt(dia,s[0]),k="m"+dia+s[0];
      var det=o[3].map(function(i){return ITEMS[i[0]][0].toLowerCase()+" "+i[1]+(ITEMS[i[0]][1]==="ud"?" ud":" "+ITEMS[i[0]][1])}).join(" · ");
      return `<label class="it"><input type="checkbox" ${S.ck[k]?'checked':''} onchange="tg('${k}',this.checked);render()"><span><b>${s[1]} ${SL[s[0]]}</b><span class="kc">${o[2]} kcal</span><em>${esc(o[1])}</em><span class="sub">${esc(det)}</span></span></label><div class="gy"><select class="sel" onchange="pk('${dia}','${s[0]}',this.value)">${OPT[s[0]].map(function(x){return `<option value="${x[0]}" ${x[0]===o[0]?'selected':''}>${esc(x[1])} · ${x[2]}</option>`}).join("")}</select></div>`}).join("")+'<button class="r" onclick="reset(\'m'+dia+'\')">Reiniciar día</button></div>';
    h+=unView(dia);
  }else if(tab==="gym"){
    var g=GYM[gd],T=new Date().toISOString().slice(0,10);
    h+=chips(Object.keys(GYM),gd,"setGd");
    h+=`<div class="card"><h3>${esc(g[0])}</h3><div class="bar"><i id="pg"></i></div><span id="pt" class="sub"></span>`;
    if(g[2]){
      h+=g[1].map(function(e,i){return chk("g"+gd+i,e)}).join("");
      var kr=S.kg["r"+gd]||{},lr=last(kr);
      h+=`<div class="gy">RPE (1–10): <input class="n" type="number" inputmode="numeric" min="1" max="10" placeholder="${lr[0]||'–'}" value="${kr.d===T?(kr.v||''):''}" onchange="sk('r${gd}','v',this.value)">${lr[0]?' · anterior: '+lr[0]:''}</div>`;
    }else{
      h+='<p class="sub"><b>Calentamiento</b> · los kg de aproximación se calculan solos con el peso que pongas en cada ejercicio (o el de la última vez).</p>'+(WARM[gd]||[]).map(function(x,i){var wid="g"+gd+"u"+i;return `<label class="wu"><input type="checkbox" ${S.ck[wid]?'checked':''} onchange="tg('${wid}',this.checked)"><span>${esc(x)}</span></label>`}).join("");
      h+=g[1].map(function(e,i){var id="g"+gd+i,k=S.kg[id]||{},l=last(k),td=k.d===T,gl=goal(l,e);
        return chk(id,(e[6]?"★ ":"")+e[0]+" — "+e[1]+" × "+e[2]+"–"+e[3]+" · RIR "+e[4]+" · "+e[5])+wup(id,e,td?k.v:l[0])+`<div class="gy"><input class="n" type="number" inputmode="decimal" step="0.5" placeholder="${l[0]||'kg'}" value="${td?(k.v||''):''}" onchange="sk('${id}','v',this.value)"> kg × <input class="n" type="number" inputmode="numeric" placeholder="${l[1]||'reps'}" value="${td?(k.r||''):''}" onchange="sk('${id}','r',this.value)">${l[0]?' · anterior: '+l[0]+'×'+(l[1]||'?'):''}${gl?' · '+gl:''}</div>`}).join("");
    }
    h+='<button class="r" onclick="reset(\'g'+gd+'\')">Reiniciar sesión</button></div>';
    h+='<div class="card"><h3>⏱️ Reglas del gym</h3>'+REGLAS.map(function(r){return '<div class="meal"><em>'+esc(r)+'</em></div>'}).join("")+'</div>';
    h+='<div class="card"><h3>🥊 Qué aporta el boxeo</h3><p class="sub">Ya trabajas deltoides anterior, rotadores, core/oblicuos y resistencia. En el gym prioriza pecho, espalda gruesa, brazos y pierna pesada (en boxeo haces resistencia de pierna, no hipertrofia).</p></div>';
  }else if(tab==="uni"){
    h+=uniView();
  }else{
    h+='<div class="card"><h3>💡 Suplementos y consejos</h3>'+TIPS.map(function(t){return '<div class="meal"><b>'+esc(t[0])+'</b><em>'+esc(t[1])+'</em></div>'}).join("")+'</div>';
    h+='<div class="card"><h3>Semana de un vistazo</h3>'+ORD.map(function(o){return '<div class="meal"><b>'+o+' · '+esc(DIAS[o].t)+'</b><span>'+(DIAS[o].tg+' kcal')+'</span></div>'}).join("")+'</div>';
  }
  document.getElementById("app").innerHTML=h;
  prog();loadImgs();
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){setTab(b.dataset.t)}});
weekReset();render();setInterval(tick,1000);
try{navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
